<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reproductor para invitación</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: grid;
      place-items: center;
      padding: 12px;
      background: transparent;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #483b3c;
    }
    .player {
      width: min(100%, 480px);
      padding: 18px 20px 20px;
      border: 1px solid #e9dfda;
      border-radius: 20px;
      background: #fffaf7;
      box-shadow: 0 5px 16px rgb(91 69 62 / 7%);
      text-align: center;
    }
    .title { margin: 0 0 12px; font-size: 16px; font-weight: 600; }
    audio { display: block; width: 100%; height: 48px; }
    @media (prefers-reduced-motion: no-preference) {
      .player { transition: box-shadow .2s ease; }
      .player:hover { box-shadow: 0 8px 22px rgb(91 69 62 / 11%); }
    }
  </style>
</head>
<body>
  <main class="player">
    <p class="title">♫ Dale play para escuchar</p>
    <audio controls preload="metadata">
      <source src="./invitacion.mp3" type="audio/mpeg">
      Tu navegador no admite la reproducción de audio.
    </audio>
  </main>
</body>
</html>
